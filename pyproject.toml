[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authority-linker"
version = "0.1.0"
description = "Authority Linker: Normdatenverknüpfung und -anreicherung für Personen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "pip>=26.0.1",
  "redis>=7.4.0",
  "uri-resolver @ git+https://github.com/ubffm/uri-resolver.git@main",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["authority_linker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: Tests, die externe Dienste oder Live-Systeme benötigen."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["authority_linker"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[project.scripts]
authority-linker-process-directory = "authority_linker.cli.process_directory:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.5.7",
    "jupyter-server>=2.18.0",
    "mistune>=3.2.1",
    "odfpy>=1.4.1",
    "pandas>=3.0.2",
    "pip-audit>=2.10.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
